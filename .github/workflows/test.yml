name: Installer et tester CYBER

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            package: "."
          - os: macos-latest
            python: "3.13"
            package: ".[mcp]"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Installer le paquet
        run: python -m pip install --only-binary=:all: "$PACKAGE"
        env:
          PACKAGE: ${{ matrix.package }}
      - run: python -m unittest discover -s tests
      - name: Exécuter la commande installée hors du dépôt
        working-directory: ${{ runner.temp }}
        run: |
          cyber-code-check --version
          cyber-code-check scan-repo "$GITHUB_WORKSPACE/examples/demo-repo" --output rapport
          cyber-code-check advisories "$GITHUB_WORKSPACE/examples/demo-repo/package-lock.json" --inventory-only
