name: Installer et tester CYBER

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Installer le paquet
        run: python -m pip install --only-binary=:all: .
      - name: Installer l’option MCP
        if: matrix.python == '3.13'
        run: python -m pip install --only-binary=:all: ".[mcp]"
      - run: python -m unittest discover -s tests
      - name: Exécuter la commande installée hors du dépôt
        run: |
          cd "$RUNNER_TEMP"
          cyber-code-check --version
          cyber-code-check scan-repo "$GITHUB_WORKSPACE/examples/demo-repo" --output rapport
          cyber-code-check advisories "$GITHUB_WORKSPACE/examples/demo-repo/package-lock.json" --inventory-only
